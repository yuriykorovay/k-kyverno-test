apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bad-missing-labels
  namespace: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cartservice
      ports:
        - protocol: TCP
          port: 7070