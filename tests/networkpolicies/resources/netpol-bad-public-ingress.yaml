apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bad-public-ingress
  namespace: frontend
  labels:
    owner: netsec
    change-id: CHG-0002
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80