stages:
  - lint
  - kyverno-test
  - kyverno-validate
  - kubernetes-dry-run
  - notify
  - approval
  - deploy

variables:
  KYVERNO_VERSION: "v1.12.0"
  KYVERNO_POLICIES_DIR: "policies/kyverno"
  NETWORKPOLICIES_DIR: "apps/online-boutique/networkpolicies"

.install_kyverno_cli:
  before_script:
    - apk add --no-cache curl tar gzip ca-certificates findutils
    - echo "Installing Kyverno CLI ${KYVERNO_VERSION}..."
    - curl -sSL -o kyverno-cli.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
    - tar -xzf kyverno-cli.tar.gz
    - chmod +x kyverno
    - mv kyverno /usr/local/bin/kyverno
    - kyverno version

lint:kubernetes-yaml:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache yq findutils
  script:
    - echo "Checking YAML syntax for Kyverno policies..."
    - |
      if [ ! -d "${KYVERNO_POLICIES_DIR}" ]; then
        echo "Directory ${KYVERNO_POLICIES_DIR} does not exist"
        exit 1
      fi

      KYVERNO_FILES=$(find ${KYVERNO_POLICIES_DIR} -type f \( -name "*.yaml" -o -name "*.yml" \))

      if [ -z "$KYVERNO_FILES" ]; then
        echo "No Kyverno policy YAML files found in ${KYVERNO_POLICIES_DIR}"
        exit 1
      fi

      for file in $KYVERNO_FILES; do
        echo "Linting $file"
        yq '.' "$file" >/dev/null
      done

    - echo "Checking YAML syntax for NetworkPolicy manifests..."
    - |
      if [ ! -d "${NETWORKPOLICIES_DIR}" ]; then
        echo "Directory ${NETWORKPOLICIES_DIR} does not exist"
        exit 1
      fi

      NETWORKPOLICY_FILES=$(find ${NETWORKPOLICIES_DIR} -type f \( -name "*.yaml" -o -name "*.yml" \))

      if [ -z "$NETWORKPOLICY_FILES" ]; then
        echo "No NetworkPolicy YAML files found in ${NETWORKPOLICIES_DIR}"
        exit 1
      fi

      for file in $NETWORKPOLICY_FILES; do
        echo "Linting $file"
        yq '.' "$file" >/dev/null
      done

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

kyverno:unit-tests:
  stage: kyverno-test
  image: alpine:3.20
  extends: .install_kyverno_cli
  script:
    - echo "Running Kyverno unit tests..."
    - kyverno test tests/networkpolicies --detailed-results
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

kyverno:validate-networkpolicies:
  stage: kyverno-validate
  image: alpine:3.20
  extends: .install_kyverno_cli

  script:
    - echo "Searching NetworkPolicy YAML files..."
    - |
      echo "START Kyverno NetworkPolicy validation" > kyverno-validation-report.txt
      echo "Project: ${CI_PROJECT_PATH}" >> kyverno-validation-report.txt
      echo "Branch: ${CI_COMMIT_BRANCH}" >> kyverno-validation-report.txt
      echo "Commit: ${CI_COMMIT_SHORT_SHA}" >> kyverno-validation-report.txt
      echo "" >> kyverno-validation-report.txt

      FILES=$(find ${NETWORKPOLICIES_DIR} -type f \( -name "*.yaml" -o -name "*.yml" \))

      if [ -z "$FILES" ]; then
        echo "No NetworkPolicy YAML files found in ${NETWORKPOLICIES_DIR}" | tee -a kyverno-validation-report.txt
        echo "FAILED" > validation-status.txt
        exit 1
      fi

      echo "Found files:" | tee -a kyverno-validation-report.txt
      echo "$FILES" | tee -a kyverno-validation-report.txt

    - echo "Validating NetworkPolicy manifests with Kyverno..."
    - |
      FAILED=0

      for file in $(find ${NETWORKPOLICIES_DIR} -type f \( -name "*.yaml" -o -name "*.yml" \)); do
        echo "" | tee -a kyverno-validation-report.txt
        echo "===================================================" | tee -a kyverno-validation-report.txt
        echo "FILE: $file" | tee -a kyverno-validation-report.txt
        echo "===================================================" | tee -a kyverno-validation-report.txt

        kyverno apply ${KYVERNO_POLICIES_DIR} \
          --resource "$file" \
          --detailed-results \
          > kyverno-current-output.txt 2>&1

        KYVERNO_EXIT_CODE=$?

        cat kyverno-current-output.txt | tee -a kyverno-validation-report.txt

        if [ "$KYVERNO_EXIT_CODE" -ne 0 ]; then
          FAILED=1
          echo "" | tee -a kyverno-validation-report.txt
          echo "RESULT: FAILED for file $file" | tee -a kyverno-validation-report.txt
        else
          echo "" | tee -a kyverno-validation-report.txt
          echo "RESULT: PASSED for file $file" | tee -a kyverno-validation-report.txt
        fi
      done

      echo "" | tee -a kyverno-validation-report.txt
      echo "===================================================" | tee -a kyverno-validation-report.txt

      if [ "$FAILED" -ne 0 ]; then
        echo "Kyverno validation FAILED" | tee -a kyverno-validation-report.txt
        echo "FAILED" > validation-status.txt
        exit 1
      fi

      echo "Kyverno validation PASSED" | tee -a kyverno-validation-report.txt
      echo "PASSED" > validation-status.txt

  artifacts:
    when: always
    paths:
      - kyverno-validation-report.txt
      - validation-status.txt
      - kyverno-current-output.txt
    expire_in: 7 days

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

kubernetes:server-dry-run:
  stage: kubernetes-dry-run
  image: alpine/k8s:1.31.5

  script:
    - echo "Preparing kubeconfig..."
    - |
      if [ -z "$KUBECONFIG_FILE" ]; then
        echo "KUBECONFIG_FILE variable is not set"
        echo "Skipping Kubernetes server dry-run because kubeconfig is unavailable."
        exit 0
      fi

    - export KUBECONFIG="${KUBECONFIG_FILE}"

    - echo "Checking Kubernetes access..."
    - kubectl version --client
    - kubectl get nodes

    - echo "Server dry-run for Kyverno policies..."
    - kubectl apply --dry-run=server -f ${KYVERNO_POLICIES_DIR}

    - echo "Server dry-run for NetworkPolicies recursively..."
    - kubectl apply --dry-run=server -R -f ${NETWORKPOLICIES_DIR}

  needs:
    - job: lint:kubernetes-yaml
    - job: kyverno:unit-tests
    - job: kyverno:validate-networkpolicies

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

notify:teams:
  stage: notify
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl jq

  script:
    - echo "Preparing Teams notification..."
    - |
      STATUS=$(cat validation-status.txt 2>/dev/null || echo "FAILED")
      REPORT=$(cat kyverno-validation-report.txt 2>/dev/null | tail -n 80 || echo "No Kyverno validation report found")

      if [ "$STATUS" = "PASSED" ]; then
        TITLE="Kyverno Validation PASSED"
        ICON="✅"
      else
        TITLE="Kyverno Validation FAILED"
        ICON="❌"
      fi

      MESSAGE=$(jq -n \
        --arg status "$STATUS" \
        --arg title "$TITLE" \
        --arg icon "$ICON" \
        --arg project "$CI_PROJECT_PATH" \
        --arg branch "$CI_COMMIT_BRANCH" \
        --arg commit "$CI_COMMIT_SHORT_SHA" \
        --arg pipeline "$CI_PIPELINE_URL" \
        --arg report "$REPORT" \
        '{
          status: $status,
          title: $title,
          icon: $icon,
          project: $project,
          branch: $branch,
          commit: $commit,
          pipeline: $pipeline,
          report: $report
        }'
      )

      echo "Validation status: $STATUS"

      if [ -z "$TEAMS_WEBHOOK_URL" ]; then
        echo "TEAMS_WEBHOOK_URL is empty. Skipping Teams notification."
        exit 0
      fi

      curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d "$MESSAGE"

  needs:
    - job: kyverno:validate-networkpolicies
      artifacts: true
      optional: true

  when: always
  allow_failure: true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

approval:manual:
  stage: approval
  image: alpine:3.20

  script:
    - echo "Manual approval required before deploy"
    - echo "Kyverno validation passed and Teams notification was sent."
    - echo "Approver can now allow deployment of NetworkPolicies."

  when: manual
  allow_failure: false

  needs:
    - job: kyverno:validate-networkpolicies

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never

deploy:networkpolicies:
  stage: deploy
  image: alpine/k8s:1.31.5

  needs:
    - job: approval:manual

  script:
    - |
      if [ -z "$KUBECONFIG_FILE" ]; then
        echo "KUBECONFIG_FILE variable is not set"
        exit 1
      fi

    - export KUBECONFIG="${KUBECONFIG_FILE}"

    - echo "Checking Kubernetes access..."
    - kubectl get nodes

    - echo "Deploying NetworkPolicies..."
    - kubectl apply -R -f ${NETWORKPOLICIES_DIR}

    - echo "Current NetworkPolicies:"
    - kubectl get networkpolicy -A

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never