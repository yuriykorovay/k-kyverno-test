apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: internet-egress-test
  namespace: payments
spec:
  selector: app == "payment-api"

  types:
    - Egress

  egress:
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - 0.0.0.0/0
        ports:
          - 443