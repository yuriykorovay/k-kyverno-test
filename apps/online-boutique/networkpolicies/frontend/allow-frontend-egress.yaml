apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-productcatalog
  namespace: frontend
  labels:
    owner: netsec
    change-id: CHG-0001

spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: productcatalogservice
      ports:
        - protocol: TCP
          port: 3550