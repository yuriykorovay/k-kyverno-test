apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-productcatalog
  namespace: frontend
  annotations:
    security.company.com/owner: devops-team-a
    security.company.com/business-justification: Allow frontend to backend traffic.
    security.company.com/risk-level: Low
    security.company.com/change-id: NetPol0001
  labels:
    owner: netsec
    change-id: CHG-0001

spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: productcatalogservice
      ports:
        - protocol: TCP
          port: 3550